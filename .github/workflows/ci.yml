name: CI

on:
  push:
    branches: [main]
    # Milestone tags publish an image of their own, so they have to run the
    # checks as well: a tagged image nobody tested is worse than no tag.
    tags: ["m*", "v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is what Dax develops on; 22 is what the Docker image runs.
        # Running both keeps a version-specific bug from hiding until deploy.
        node: ["20.19.0", "22.23.4"]

    services:
      postgres:
        # Matches the PostgreSQL 17 the deployment targets.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: headroom-test
          POSTGRES_DB: headroom_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d headroom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test harness refuses any database whose name does not look
      # disposable, so real data can never be the target in CI either.
      TEST_DATABASE_URL: postgresql://postgres:headroom-test@127.0.0.1:55432/headroom_test?schema=public

    steps:
      - uses: actions/checkout@v7

      # The version comes from `packageManager` in package.json, which is the
      # one place it should live. Passing it here as well is now an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm -F @headroom/api db:generate

      - name: Build the calculation engine
        # The API and the web app both import @headroom/core from its dist.
        run: pnpm -F @headroom/core build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify the synthetic fixture reproduces its own expected values
        # The real seed is never in git (Dax's decision, 2026-11-07), so CI
        # checks the committed synthetic fixture instead.
        run: python3 seed/check_seed.py packages/core/test/fixtures/household-synthetic.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        # Must keep working from a plain clone with no registry login
        # (HANDOFF section 11).
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: headroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image starts and refuses a bad configuration
        run: |
          # With no DATABASE_URL the app must exit 78 (EX_CONFIG) rather than
          # start half-configured.
          set +e
          output=$(docker run --rm \
            -e APP_ORIGIN=https://headroom.example.ts.net \
            -e SESSION_SECRET=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n') \
            headroom:ci node apps/api/dist/server.js 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 78 ]; then
            echo "Expected exit code 78 for a missing DATABASE_URL, got $code" >&2
            exit 1
          fi
          echo "$output" | grep -q "DATABASE_URL" || {
            echo "The error message should name the missing variable" >&2
            exit 1
          }

  publish:
    name: publish to GHCR
    runs-on: ubuntu-24.04

    # Only after lint, typecheck, the tests on both Node versions, and the
    # image smoke test. The household runs whatever this pushes, so an
    # untested image must never become `latest`.
    needs: [check, docker]

    # Never from a pull request: a fork has no write token, and a PR should not
    # be able to replace the image the household pulls.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      # The only extra permission needed. No PAT is involved: the
      # workflow-scoped GITHUB_TOKEN can write this repository's packages.
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lower-case on purpose: GHCR rejects a mixed-case path, and the
          # owner is spelled DaxtonD.
          images: ghcr.io/daxtond/headroom
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Unraid is x86, and a second architecture would double the build
          # for nothing. Add linux/arm64 here if that ever changes.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shares the cache the `docker` job above already filled, so this
          # does not rebuild from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pull
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "In Unraid's Docker Manager, pull:"
            echo '```'
            echo "ghcr.io/daxtond/headroom:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
