<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the layout reaches under a phone's notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Matches the dark green hero, so the phone's status bar blends in. -->
    <meta name="theme-color" content="#123B33" />
    <meta
      name="description"
      content="Headroom: the household budget, with the adding up already done."
    />
    <!-- Household finances must never be indexed or previewed anywhere. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />

    <title>Headroom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Headroom needs JavaScript to work out the running balances. Please enable it and reload.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
